<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Flappy Bird</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Flappy Bird</h1>
    <button id="muteButton" type="button" aria-pressed="false">Sound: On</button>
  </header>

  <main>
    <canvas id="gameCanvas" width="360" height="640" aria-label="Flappy Bird game"></canvas>
  </main>

  <p class="hint">Press <kbd>Space</kbd>, click, or tap to flap.</p>

  <script src="game.js"></script>
</body>
</html>
